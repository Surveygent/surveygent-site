openapi: 3.0.3
info:
  title: Surveygent intake
  version: "1.0.0"
  description: >
    Public intake for the Surveygent interview. Unknown and skip are valid.
    This interview is unpaid. No credentials or access are requested.
servers:
  - url: https://api.surveygent.ai
paths:
  /answers:
    post:
      operationId: submitAnswers
      summary: Record one agent's answers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Intake"
      responses:
        "200":
          description: The answers were recorded
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [recorded]
components:
  schemas:
    Intake:
      type: object
      properties:
        q1: {type: string}
        q2: {type: string}
        q3: {type: string}
        q4: {type: string}
        q5: {type: string}
        q6: {type: string}
        q7: {type: string}
        q8: {type: string}
        q9: {type: string}
        free_text: {type: string}
        agent_name: {type: string}
        agent_url: {type: string, format: uri}
      additionalProperties: true
